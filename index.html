<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日記入力システム</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        /* カラーパレットの定義（ライトモード） */
        :root {
            --bg-color: #f5f7fa;
            --text-color: #333333;
            --input-bg: #ffffff;
            --border-color: #ced4da;
            --btn-post-bg: #0d6efd;
            --btn-post-text: #ffffff;
            --btn-post-disabled: #a5c7fe;
            --btn-clear-bg: #6c757d;
            --btn-clear-disabled: #c6cace;
            --sys-msg-error: #dc3545;
            --sys-msg-success: #198754;
        }

        /* ダークモード時の上書き */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --input-bg: #1e1e1e;
                --border-color: #444444;
                --btn-post-bg: #3d8bfd;
                --btn-post-disabled: #1d3e75;
                --btn-clear-bg: #5c636a;
                --btn-clear-disabled: #32363a;
                --sys-msg-error: #ff6b6b;
                --sys-msg-success: #479f76;
            }
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            transition: background-color 0.3s, color 0.3s;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
            transition: background-color 0.3s, color 0.3s;
        }

        .controls {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 12px;
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        #postBtn {
            background-color: var(--btn-post-bg);
            color: var(--btn-post-text);
        }

        #postBtn:disabled {
            background-color: var(--btn-post-disabled);
            cursor: not-allowed;
        }

        #clearBtn {
            background-color: var(--btn-clear-bg);
            color: #ffffff;
        }

        #clearBtn:disabled {
            background-color: var(--btn-clear-disabled);
            cursor: not-allowed;
        }

        #systemMessage {
            margin-top: 16px;
            min-height: 24px;
            white-space: pre-wrap;
            font-weight: bold;
        }

        .error { color: var(--sys-msg-error); }
        .success { color: var(--sys-msg-success); }
    </style>
</head>
<body>

    <textarea id="diaryInput" placeholder="今日の出来事、気付き、メモなど...(Ctrl+Enterで投稿)"></textarea>
    
    <div class="controls">
        <button id="postBtn" disabled>投稿する</button>
        <button id="clearBtn" disabled>クリア</button>
    </div>
    
    <div id="systemMessage"></div>

    <script>
        // ★ GASのWebアプリデプロイURLに書き換えてください ★
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzhM2yrmEVM-cfB0l3NKr2AlrJgBYgUr_J4YEkQr_gXZ1y9Oh_vo1TLZQ0eu71-gLj8/exec'; 

        const input = document.getElementById('diaryInput');
        const postBtn = document.getElementById('postBtn');
        const clearBtn = document.getElementById('clearBtn');
        const sysMsg = document.getElementById('systemMessage');

        // ボタンの活性/非活性を切り替える
        const updateBtnState = () => {
            const hasText = input.value.trim().length > 0;
            postBtn.disabled = !hasText;
            clearBtn.disabled = !hasText;
        };

        // 入力時のイベント
        input.addEventListener('input', updateBtnState);

        // Ctrl+Enterでの投稿イベント
        input.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                if (!postBtn.disabled) executePost();
            }
        });

        // クリアボタンのイベント
        clearBtn.addEventListener('click', () => {
            input.value = '';
            updateBtnState();
            sysMsg.textContent = '';
        });

        // 投稿処理
        const executePost = async () => {
            const text = input.value;
            
            postBtn.disabled = true;
            postBtn.textContent = '処理中';
            sysMsg.textContent = '';
            sysMsg.className = '';

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ text: text })
                });

                const result = await response.json();
                
                if (result.success) {
                    input.value = '';
                    sysMsg.textContent = '投稿に成功しました。';
                    sysMsg.className = 'success';
                    postBtn.textContent = '投稿する';
                    updateBtnState();
                } else {
                    throw new Error(result.error || '不明なエラーが発生しました。');
                }
            } catch (error) {
                sysMsg.textContent = `投稿に失敗しました。\n【APIのエラーメッセージ】: ${error.message}`;
                sysMsg.className = 'error';
                postBtn.disabled = false;
                postBtn.textContent = '投稿する';
            }
        };

        postBtn.addEventListener('click', executePost);

        // Service Workerの登録 (PWA用)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
